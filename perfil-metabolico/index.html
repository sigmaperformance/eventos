<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Descubra seu perfil metabólico em 2 minutos. Lidiany Canto Gontijo, Nutricionista Clínica Funcional.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Perfil Metabólico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: tablet kiosk, one card per step, logo header, progress bar, big tap targets */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1E2B24; --muted:#5D6B63; --line:#DCE3DD;
  --brand:#2F5240; --accent:#2F5240; --accent-ink:#FFFFFF; --warm:#C9773F; --soft:#E5EDE7;
  --display:"Josefin Sans","Century Gothic","Trebuchet MS",sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#1A2520; --ink:#E7EFE9; --muted:#9CAEA3; --line:#2B3932;
  --brand:#A9CDB6; --accent:#7DBF98; --accent-ink:#0D1611; --warm:#E9A06C; --soft:#21312A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1A2520; --ink:#E7EFE9; --muted:#9CAEA3; --line:#2B3932;
  --brand:#A9CDB6; --accent:#7DBF98; --accent-ink:#0D1611; --warm:#E9A06C; --soft:#21312A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{height:46px;aspect-ratio:870/188;max-width:70%;background:var(--brand);-webkit-mask:var(--logo) left center/contain no-repeat;mask:var(--logo) left center/contain no-repeat}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);border:1px solid var(--warm);border-radius:99px;padding:3px 10px;flex:none}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.005em;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1}
h2{font-size:clamp(22px,4.4vw,30px);line-height:1.2}
p{margin:0}
.lead{color:var(--muted);font-size:17px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=tel],input[type=number]{font:inherit;font-size:18px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.seg{display:flex;gap:10px;margin-top:6px}.seg button{flex:1}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:14px;color:var(--muted)}
.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px 22px;font-weight:800;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;color:var(--muted);border:0;font-weight:700;padding:10px}
.opt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;font-size:17px;font-weight:600;text-align:left}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.opts{display:flex;flex-direction:column;gap:10px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.pic{padding:0;border:3px solid transparent;border-radius:14px;overflow:hidden;background:var(--bg);position:relative;line-height:0}
.pic img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pic[aria-pressed=true]{border-color:var(--accent)}
.pic[aria-pressed=true]::after{content:"✓";position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 15px/26px var(--body);text-align:center}
.pic .was{position:absolute;top:6px;left:6px;background:var(--warm);color:#1E120A;font:800 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:99px}
.shapes{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:8px}
@media (max-width:560px){.shapes{grid-template-columns:repeat(3,1fr)}}
.shape{padding:0 0 8px;border:3px solid transparent;border-radius:14px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.shape img{width:100%;height:auto;display:block}
.shape span{font-weight:800;font-size:14px}
.shape[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.bris{display:flex;flex-direction:column;gap:8px}
.bri{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:6px 14px 6px 6px;text-align:left}
.bri img{width:100%;height:auto;border-radius:8px;background:#fff}
.bri b{display:block;font-size:15px}.bri small{color:var(--muted);font-size:13px;font-weight:600}
@media (max-width:420px){.bri{grid-template-columns:110px 1fr}}
.pill{align-self:flex-start;background:var(--warm);color:#1E120A;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.bars{display:flex;flex-direction:column;gap:10px}
.b{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.b .t{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.b .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.b .t i.hi{background:var(--warm)}
.b em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;max-width:460px;width:100%;align-self:center}
.duo figure{margin:0;display:flex;flex-direction:column;gap:6px;text-align:center;font-weight:800;font-size:13px;color:var(--muted)}
.duo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}
.duo .arrow{font-size:28px;color:var(--warm)}
.box{background:var(--soft);border-radius:16px;padding:16px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.box img{width:72px;border-radius:10px}
.box p{font-size:15px}
ul.tips{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.route{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.route strong{font-family:var(--display);font-weight:600;font-size:22px}
.ebook{background:var(--soft);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn.wa{display:block;text-align:center;text-decoration:none;line-height:1.3}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.qrbox #qr{background:#fff;padding:8px;border-radius:10px;line-height:0}.qrbox #qr img,.qrbox #qr canvas{width:120px;height:120px}
.qrbox p{font-size:14px;color:var(--muted)}
@media (max-width:420px){.qrbox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.insta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;justify-content:center;text-align:center}.insta span{color:var(--muted);font-size:14px}.insta strong{font-family:var(--display);font-size:22px;font-weight:600;color:var(--accent)}.insta small{color:var(--muted);font-size:12px;width:100%}
.kcal{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.kgrid{grid-template-columns:1fr}}
.kgrid div{display:flex;flex-direction:column;min-width:0}
.kgrid b{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.kgrid span{font-weight:800;font-size:13px}.kgrid small{color:var(--muted);font-size:13px;line-height:1.35}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px 14px}
.ref{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

const FORMATOS_=()=>S.sexo==="M"?FORMATOS_M:FORMATOS_F;
const SHAPES=()=>S.sexo==="M"?IMG.shapesM:IMG.shapes;
const BRISTOL=[["Tipo 1","Bolinhas duras e separadas","preso"],["Tipo 2","Formato de salsicha, com caroços","preso"],["Tipo 3","Salsicha com rachaduras","normal"],["Tipo 4","Lisa e macia, como uma cobra","normal"],["Tipo 5","Pedaços macios, bordas definidas","solto"],["Tipo 6","Pedaços moles, bordas irregulares","solto"],["Tipo 7","Totalmente líquida","solto"]];

const Q=[
 {id:"energia",q:"Como está sua energia ao longo do dia?",o:[["Constante, me sinto bem",{}],["Cai depois do almoço",{en:2}],["Já acordo cansada(o)",{en:3}]]},
 {id:"doce",q:"Com que frequência bate vontade de doce ou de beliscar?",o:[["Raramente",{}],["Algumas vezes por semana",{fo:1}],["Todo dia",{fo:3}]]},
 {id:"sono",q:"Como anda o seu sono?",o:[["Durmo bem",{}],["Demoro a dormir ou acordo à noite",{fo:1,en:1,ho:1}],["Durmo mal quase sempre",{fo:2,en:2,ho:1}]]},
 {id:"prot",q:"Você come proteína (ovo, carne, frango, peixe, feijão) nas refeições?",o:[["Em todas as refeições",{}],["Na maioria delas",{mu:1}],["Só no almoço e jantar",{mu:2}],["Raramente",{mu:3}]]},
 {id:"agua",q:"Quanta água você bebe por dia?",o:[["2 litros ou mais",{}],["Mais ou menos 1 litro",{en:1}],["Quase nada",{en:2}]]},
 {id:"ultra",q:"Biscoito, salgadinho, refrigerante, congelados…",o:[["Raramente",{}],["Algumas vezes por semana",{en:1,fo:1}],["Todo dia",{en:2,fo:2}]]},
 {id:"ativ",q:"Como é a sua rotina de movimento?",o:[["Fico sentada(o) a maior parte do dia",{}],["Caminho ou me exercito 1 a 3x por semana",{}],["Me exercito 3 a 5x por semana",{}],["Treino pesado quase todo dia",{}]]},
 {id:"forca",q:"Você faz treino de força (musculação, funcional)?",o:[["2x ou mais por semana",{}],["Às vezes",{mu:1}],["Não faço",{mu:3}]]},
 {id:"bristol",bristol:1,q:"Qual destas imagens parece mais com as suas fezes, na maioria das vezes?"},
 {id:"inch",q:"Você sente a barriga inchada?",o:[["Quase nunca",{}],["Depois de algumas refeições",{en:1}],["Quase todo dia",{en:2}]]},
 {id:"ciclo",h:1,q:"Como está seu ciclo menstrual?",o:[["Regular",{}],["Ficou irregular ou mudou",{ho:2}],["Já parou",{ho:2}]]},
 {id:"calor",h:1,q:"Você sente calorões ou suor à noite?",o:[["Não",{}],["Às vezes",{ho:2}],["Com frequência",{ho:3}]]},
 {id:"barriga",h:1,q:"A gordura na barriga aumentou mesmo comendo igual?",o:[["Não",{}],["Um pouco",{ho:1}],["Sim, bastante",{ho:2}]]}
];
Q.find(q=>q.bristol).o=BRISTOL.map(b=>[b[0],b[2]==="normal"?{}:{en:2}]);
const hormo=()=>S.sexo==="F"&&+S.idade>=35;
const qs=()=>Q.filter(q=>!q.h||hormo());
const fotos=()=>IMG[S.sexo];

const P={
 ho:{bonus:"Depois dos 35: seu prato precisa acompanhar seu corpo",t:"Metabolismo em Transição Hormonal",d:"suas respostas mostram sinais típicos da perimenopausa: sono, calorões e gordura abdominal mudando mesmo sem mudar a alimentação. Nessa fase o corpo responde diferente, e a estratégia precisa mudar junto.",tips:["Proteína em todas as refeições para proteger a massa muscular","Treino de força é prioridade, mais que cardio","Cuidar do sono faz diferença na fome e na barriga"],r:"Conversa com a nutricionista",rs:"Nessa fase, alimentação e treino precisam ser ajustados juntos.",dest:"Sigma"},
 fo:{bonus:"Lanches que realmente sustentam",t:"Fome Desregulada",d:"a vontade de doce e de beliscar aparece com frequência, e isso costuma vir junto com sono ruim e refeições pobres em proteína e fibra. Não é falta de força de vontade.",tips:["Começar o dia com proteína reduz a fome da tarde","Não pular refeições evita o beliscar","Ter um lanche planejado no meio da tarde"],r:"Consulta nutricional",rs:"Plano para organizar as refeições e controlar a fome.",dest:"Nutri"},
 en:{bonus:"7 dias para cuidar da sua energia",t:"Energia em Baixa",d:"cansaço, pouca água, ultraprocessados e intestino desregulado formam um ciclo que derruba a disposição. Pequenos ajustes costumam dar resultado rápido.",tips:["Garrafa de água sempre à vista","Trocar um ultraprocessado por fruta ou castanhas","Incluir verduras no almoço e no jantar"],r:"Consulta nutricional",rs:"Ajustes práticos para recuperar a energia e o intestino.",dest:"Nutri"},
 mu:{bonus:"Proteína em todas as refeições",t:"Músculo em Risco",d:"pouca proteína e pouco treino de força fazem o corpo perder músculo com o tempo. Músculo é o que mantém o metabolismo ativo e a força no dia a dia.",tips:["Proteína no café da manhã, almoço e jantar","Começar treino de força 2x por semana","Avaliar força e composição corporal"],r:"Consulta nutricional + treino",rs:"Nutrição e treino trabalhando juntos.",dest:"Nutri"},
 ok:{bonus:"Ajustes finos para o seu objetivo",t:"No Caminho Certo",d:"seus hábitos estão bem encaminhados. Agora o ganho está nos detalhes: ajustar quantidades e horários para o seu objetivo.",tips:["Manter a proteína distribuída no dia","Seguir com o treino de força","Ajustar o plano para o corpo que você quer"],r:"Consulta nutricional",rs:"Plano personalizado para chegar no objetivo.",dest:"Nutri"}
};
const AX=[["en","Energia"],["fo","Fome"],["mu","Músculo"],["ho","Hormonal"]];

const $=s=>document.querySelector(s), el=$("#screen");
const STEPS=()=>["intro","cad","atual","desejo","formato",...qs().map((_,i)=>"q"+i),"res"];
function go(n){S.step=n;render();scrollTo({top:0,behavior:"smooth"});}
function render(){const st=STEPS(),cur=st[S.step];$("#prog").style.width=(S.step/(st.length-1)*100)+"%";
 if(cur==="intro")return intro(); if(cur==="cad")return cad(); if(cur==="atual"||cur==="desejo")return corpo(cur);
 if(cur==="formato")return formato(); if(cur==="res")return res(); return pergunta(+cur.slice(1));}
const nav=(dis)=>`<div class="nav"><button class="ghost" id="back">Voltar</button>${dis===undefined?"<span></span>":`<button class="btn" id="nx" ${dis?"disabled":""}>Continuar</button>`}</div>`;
function wire(){const b=$("#back");if(b)b.onclick=()=>go(S.step-1);const n=$("#nx");if(n)n.onclick=()=>go(S.step+1);}

function intro(){el.innerHTML=`<span class="eyebrow">2 minutos · resultado na hora</span>
 <h1>Descubra seu perfil metabólico</h1>
 <p class="lead">Responda algumas perguntas rápidas sobre seu corpo e sua rotina e veja o que ele está pedindo agora. No final você vê também quanta energia o seu corpo gasta por dia.</p>
 <button class="btn" id="go">Começar</button>`;$("#go").onclick=()=>go(1);}

function cad(){el.innerHTML=`<span class="eyebrow">Seus dados</span><h2>Para calcular o seu resultado</h2>
 <label for="nome">Nome<input id="nome" type="text" value="${S.nome}"></label>
 <div class="row"><label for="idade">Idade<input id="idade" type="number" min="12" max="99" value="${S.idade}"></label>
 <label for="peso">Peso (kg)<input id="peso" type="number" inputmode="decimal" min="30" max="250" value="${S.peso}"></label>
 <label for="altura">Altura (cm)<input id="altura" type="number" inputmode="numeric" min="120" max="220" value="${S.altura}"></label>
 <div style="grid-column:1/-1">
 <div><label>Sexo</label><div class="seg"><button class="opt" id="sF" aria-pressed="${S.sexo==="F"}">Feminino</button><button class="opt" id="sM" aria-pressed="${S.sexo==="M"}">Masculino</button></div></div></div></div>
 ${nav(true)}`;
 const sync=()=>{S.nome=$("#nome").value;S.idade=$("#idade").value;S.peso=$("#peso").value;S.altura=$("#altura").value;$("#nx").disabled=!(S.nome&&S.idade&&S.peso&&S.altura);};
 ["#nome","#idade","#peso","#altura"].forEach(s=>$(s).oninput=sync);
 const setSexo=x=>{sync();if(S.sexo!==x){S.sexo=x;S.atual=S.desejo=S.formato=null;}cad();};
 $("#sF").onclick=()=>setSexo("F");$("#sM").onclick=()=>setSexo("M");wire();sync();}

function corpo(which){const atual=which==="atual",val=atual?S.atual:S.desejo;
 el.innerHTML=`<span class="eyebrow">Seu corpo</span>
 <h2>${atual?"Com base na sua percepção, qual destas imagens mais se parece com o seu corpo hoje?":"E qual destas imagens mostra o corpo que você gostaria de ter?"}</h2>
 <p class="lead">${atual?"Não precisa ser exato. Escolha a mais parecida.":"Pense em como você quer se sentir no espelho."}</p>
 <div class="grid">${fotos().map(([l,src],k)=>`<button class="pic" data-k="${k}" aria-pressed="${val===k}" aria-label="${l} de gordura">${!atual&&S.atual===k?'<span class="was">Hoje</span>':""}<img src="${src}" alt=""></button>`).join("")}</div>
 ${nav(val==null)}`;
 el.querySelectorAll(".pic").forEach(b=>b.onclick=()=>{atual?S.atual=+b.dataset.k:S.desejo=+b.dataset.k;corpo(which);});wire();}

function formato(){el.innerHTML=`<span class="eyebrow">Formato do corpo</span>
 <h2>Qual destes formatos é mais parecido com o seu?</h2>
 <div class="shapes" style="--n:${FORMATOS_().length}">${FORMATOS_().map((f,k)=>`<button class="shape" data-k="${k}" aria-pressed="${S.formato===k}"><img src="${SHAPES()[k]}" alt=""><span>${f.n}</span></button>`).join("")}</div>
 ${nav(S.formato==null)}`;
 el.querySelectorAll(".shape").forEach(b=>b.onclick=()=>{S.formato=+b.dataset.k;formato();});wire();}

function pergunta(i){const list=qs(),q=list[i],v=S.ans[q.id];
 const body=q.bristol
  ?`<p class="lead">Escala de Bristol. É uma das perguntas mais importantes para a nutricionista entender seu intestino.</p><div class="bris">${BRISTOL.map((b,j)=>`<button class="opt bri" data-j="${j}" aria-pressed="${v===j}"><img src="${IMG.bristol[j]}" alt=""><span><b>${b[0]}</b><small>${b[1]}</small></span></button>`).join("")}</div>`
  :`<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}" aria-pressed="${v===j}">${o[0]}</button>`).join("")}</div>`;
 el.innerHTML=`<span class="eyebrow">Pergunta ${i+1} de ${list.length}</span><h2>${q.q}</h2>${body}${nav()}`;
 el.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{S.ans[q.id]=+b.dataset.j;b.setAttribute("aria-pressed","true");setTimeout(()=>go(S.step+1),180);});wire();}

function score(){const sc={en:0,fo:0,mu:0,ho:0},mx={en:0,fo:0,mu:0,ho:0};
 qs().forEach(q=>{const a=S.ans[q.id];for(const k in mx)mx[k]+=Math.max(...q.o.map(o=>o[1][k]||0));
  if(a!=null)for(const k in q.o[a][1])sc[k]+=q.o[a][1][k];});
 // formato maçã = gordura abdominal
 mx.ho+=2;mx.fo+=1; if(S.formato===0){hormo()?sc.ho+=2:sc.fo+=1;}
 const pct={};for(const k in sc)pct[k]=mx[k]?Math.round(sc[k]/mx[k]*100):0;return pct;}

const FAT=[1.2,1.375,1.55,1.725];
function meta_(){const p=+S.peso,h=+S.altura,i=+S.idade;if(!p||!h||!i)return null;
 const tmb=10*p+6.25*h-5*i+(S.sexo==="M"?5:-161),f=FAT[S.ans.ativ??0];
 const rd=x=>Math.round(x/10)*10;return{tmb:rd(tmb),get:rd(tmb*f),agua:(p*35/1000).toFixed(1).replace(".",",")};}
const WA="5531997708886";
function waLink(p){const nome=(S.nome||"").trim();
 const txt=`Oi, Lidiany! Fiz o questionário do Perfil Metabólico no evento.${nome?` Meu nome é ${nome}.`:""} Meu perfil deu "${p.t}" e quero receber o e-book "${p.bonus}".${S.interesse===true?" Também quero entender melhor como melhorar o meu metabolismo.":""}`;
 return `https://wa.me/${WA}?text=${encodeURIComponent(txt)}`;}
function res(){const pct=score();let key;
 if(hormo()&&pct.ho>=45)key="ho";else{key=["fo","en","mu"].sort((a,b)=>pct[b]-pct[a])[0];if(pct[key]<35)key="ok";}
 const p=P[key],primeiro=(S.nome||"").split(" ")[0]||"Você";
 const f=fotos(),a=S.atual??3,d=S.desejo??2,fm=FORMATOS_()[S.formato??0];
 const br=S.ans.bristol!=null?BRISTOL[S.ans.bristol]:null;
 const brTxt=br?(br[2]==="normal"?`Intestino: ${br[0]}, dentro do esperado.`:br[2]==="preso"?`Intestino: ${br[0]}, sinal de intestino preso. Vale conversar sobre fibras e água.`:`Intestino: ${br[0]}, fezes mais soltas que o ideal. Vale investigar com a nutricionista.`):"";
 const meta=a>d?`Seu objetivo é sair de cerca de ${f[a][0]} para ${f[d][0]} de gordura.`:a<d?"Seu objetivo é ganhar corpo. Isso pede atenção especial à proteína e ao treino de força.":"Seu objetivo é manter o corpo e melhorar a saúde por dentro.";
 const axes=AX.filter(([k])=>k!=="ho"||hormo());
 el.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><span class="pill">Seu perfil</span><h1>${p.t}</h1><p class="lead">${primeiro}, ${p.d}</p></div>
 <div class="bars">${axes.map(([k,n])=>`<div class="b"><span>${n}</span><span class="t"><i class="${k===key?"hi":""}" style="width:${Math.max(pct[k],4)}%"></i></span><em>${pct[k]}</em></div>`).join("")}
 <p style="font-size:13px;color:var(--muted)">Quanto maior a barra, mais atenção esse ponto pede.</p></div>
 <div class="duo"><figure><img src="${f[a][1]}" alt="">Hoje</figure><span class="arrow">→</span><figure><img src="${f[d][1]}" alt="">Objetivo</figure></div>
 <p style="text-align:center;font-weight:700">${meta}</p>
 ${(()=>{const m=meta_();return m?`<div class="kcal"><span class="eyebrow">Seu metabolismo</span>
 <div class="kgrid"><div><b>${m.tmb.toLocaleString("pt-BR")}</b><span>kcal/dia</span><small>Taxa metabólica basal: o que seu corpo gasta em repouso</small></div>
 <div><b>${m.get.toLocaleString("pt-BR")}</b><span>kcal/dia</span><small>Gasto total estimado, somando a sua rotina de movimento</small></div>
 <div><b>${m.agua}</b><span>litros/dia</span><small>Água recomendada para o seu peso</small></div></div>
 <p class="ref">Estimativa pela equação de Mifflin-St Jeor. Quanto comer para chegar no seu objetivo, a nutricionista calcula na consulta.</p></div>`:""})()}
 <div class="box"><img src="${SHAPES()[S.formato??0]}" alt=""><div><span class="eyebrow">Formato ${fm.n}</span><p>${fm.d}</p></div></div>
 ${brTxt?`<p class="note">${brTxt}</p>`:""}
 <div><span class="eyebrow">3 passos para começar</span><ul class="tips">${p.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>
 <div class="route"><span class="eyebrow">Próximo passo</span><strong>Quer entender melhor como melhorar o seu metabolismo?</strong>
 <div class="seg"><button class="opt" id="int1" aria-pressed="${S.interesse===true}">Sim, quero conversar</button><button class="opt" id="int0" aria-pressed="${S.interesse===false}">Agora não</button></div></div>
 <div class="ebook"><span class="eyebrow">Seu material</span>
 <p>Essa avaliação é uma oportunidade de olhar um pouquinho para a sua saúde. A partir das suas respostas, preparei um material com orientações relacionadas ao seu perfil. Ele vai ajudar você a identificar alguns pontos da alimentação que merecem atenção.</p>
 <a class="btn wa" id="wa" href="${waLink(p)}" target="_blank" rel="noopener">Clique aqui para receber seu e-book: ${p.bonus}</a>
 <div class="qrbox"><div id="qr" aria-hidden="true"></div><p><b>Está usando o tablet do evento?</b><br>Aponte a câmera do seu celular para o código e envie a mensagem para receber o e-book no seu WhatsApp.</p></div></div>
 <div class="insta"><span>Dicas toda semana no Instagram</span><strong>@nutri.lidianygontijo</strong></div>
 <p class="ref">${S.sexo==="F"?"Formatos de corpo: What Your Body Shape Reveals About Your Health, Penn Medicine, 2019. ":""}Este resultado é uma triagem e não substitui a consulta.</p>
 <div class="nav"><button class="ghost" id="back">Voltar</button><button class="ghost" id="new">Próxima pessoa →</button></div>`;
 $("#int1").onclick=()=>{S.interesse=true;res();};$("#int0").onclick=()=>{S.interesse=false;res();};
 try{new QRCode($("#qr"),{text:waLink(p),width:150,height:150,colorDark:"#1E2B24",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.L});}catch(e){$(".qrbox").hidden=true;}
 wire();$("#new").onclick=()=>{Object.assign(S,{nome:"",idade:"",peso:"",altura:"",sexo:"F",ok:false,interesse:null,atual:null,desejo:null,formato:null,ans:{}});go(0);};}
render();
</script>

</body>
</html>
